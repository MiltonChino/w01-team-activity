<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <meta name="description"
    content="Review your Sleep Outside order details, shipping information, and payment options to place your order securely." />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/checkout.js" type="module" defer></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>
    </section>

    <div class="checkout-container">
      <!-- Checkout Form -->
      <form id="checkout-form" class="checkout-form">
        <fieldset>
          <legend>Shipping Address</legend>
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" autocomplete="given-name" required />
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" autocomplete="family-name" required />
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" autocomplete="street-address" required />
          <label for="city">City</label>
          <input type="text" id="city" name="city" autocomplete="address-level2" required />
          <label for="state">State</label>
          <input type="text" id="state" name="state" autocomplete="address-level1" required />
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" autocomplete="postal-code" required />
        </fieldset>

        <fieldset>
          <legend>Payment Details</legend>
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" pattern="\d{16}" placeholder="1234123412341234"
            required />
          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" placeholder="MM/YY" required />
          <label for="code">Security Code (CVV)</label>
          <input type="text" id="code" name="code" pattern="\d{3}" placeholder="123" required />
        </fieldset>

        <!-- Order Summary -->
        <fieldset class="checkout-summary order-summary-card">
          <legend>Order Summary</legend>
          <ul>
            <li>
              <span>Item Subtotal (<span id="num-items">0</span>)</span>
              <span id="subtotal">$0.00</span>
            </li>
            <li>
              <span>Shipping</span>
              <span id="shipping">$0.00</span>
            </li>
            <li>
              <span>Tax</span>
              <span id="tax">$0.00</span>
            </li>
            <li>
              <span>Order Total</span>
              <span id="orderTotal">$0.00</span>
            </li>
          </ul>
        </fieldset>

        <button type="submit" class="btn-submit">Place Order</button>
      </form>
    </div>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
